name: chicken_rush
description: "Chicken Rush - arcade road crossing game."
publish_to: 'none'

version: 1.0.0+4

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.6
  ffi: ^2.1.3

  # ── gray-flow runtime ────────────────────────────────────────────
  # Version pins deliberately differ from any sibling project.
  # Floors come from `.cursor/rules/gray_part_pitfalls.md`; patch
  # levels are hand-picked higher where possible.
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.13.0
  http: ^1.6.0
  path_provider: ^2.1.5
  package_info_plus: ^9.0.0
  device_info_plus: ^12.1.0
  connectivity_plus: ^7.1.1
  url_launcher: ^6.3.3
  shared_preferences_android: ^2.4.14
  app_links: ^6.4.1

  firebase_core: ^4.1.1
  firebase_messaging: ^16.0.3
  firebase_app_check: ^0.4.2
  flutter_local_notifications: ^19.4.2

  appsflyer_sdk: ^6.17.2
  flutter_secure_storage: ^10.0.0-beta.4

  # file picker is a known footgun — must NOT climb into 10.x (pitfall #4).
  file_picker: 8.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/Chicken_Rush_additional_assets/Vertical_Loading_Screen.webp
    - assets/Chicken_Rush_additional_assets/Horizontal_Loading_Screen.webp
    - assets/Chicken_Rush_additional_assets/Vertical_Notifications_Screen.webp
    - assets/Chicken_Rush_additional_assets/Horizontal_Notifications_Screen.webp
    - assets/Chicken_Rush_gameplay_assets/

flutter_launcher_icons:
  # Only the legacy pre-API-26 mipmaps are generated here. The adaptive icon
  # in mipmap-anydpi-v26 is hand-written so it can share one <adaptive-icon>
  # with the Android 12+ splash; leaving adaptive_icon_* out keeps this tool
  # from overwriting that file on the next run.
  android: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 26
