name: chicken_rush
description: "Chicken Rush - arcade road crossing game."
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.6
  webview_flutter: ^4.14.1
  ffi: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/Chicken_Rush_additional_assets/Vertical_Loading_Screen.webp
    - assets/Chicken_Rush_additional_assets/Horizontal_Loading_Screen.webp
    - assets/Chicken_Rush_gameplay_assets/

flutter_launcher_icons:
  # Only the legacy pre-API-26 mipmaps are generated here. The adaptive icon
  # in mipmap-anydpi-v26 is hand-written so it can share one <adaptive-icon>
  # with the Android 12+ splash; leaving adaptive_icon_* out keeps this tool
  # from overwriting that file on the next run.
  android: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 23
